name: Getty Weekly Funnel — build report
 
on:
  schedule:
    # 10:00 UTC Monday — runs ~1h before the routine that posts it
    - cron: '0 10 * * 1'
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: weekly-funnel
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
 
      - run: npm install --no-audit --no-fund
 
      - name: Build report
        env:
          ENTRANCE_EMAIL: ${{ secrets.ENTRANCE_EMAIL }}
          ENTRANCE_PASSWORD: ${{ secrets.ENTRANCE_PASSWORD }}
          ENTRANCE_WORKSPACE_ID: ${{ secrets.ENTRANCE_WORKSPACE_ID }}
          QB_USER_TOKEN: ${{ secrets.QB_USER_TOKEN }}
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          OUTPUT_DIR: out
        run: node src/index.js
 
      - name: Commit report to repo
        run: |
          git config user.name  "getty-bot"
          git config user.email "getty-bot@users.noreply.github.com"
          git add -f out/
          git diff --staged --quiet || git commit -m "funnel report $(date -u +%F)"
          git push
 
